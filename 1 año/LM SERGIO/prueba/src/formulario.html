<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Equipo Pokémon</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <h1>Forma tu Equipo</h1>
    <form>
        <input name="p1" placeholder="Pokémon 1 (ej: pikachu)" autocomplete="off">
        <input name="p2" placeholder="Pokémon 2 (ej: charizard)" autocomplete="off">
        <input name="p3" placeholder="Pokémon 3 (ej: bulbasaur)" autocomplete="off">
        <input name="p4" placeholder="Pokémon 4 (ej: squirtle)" autocomplete="off">
        <input name="p5" placeholder="Pokémon 5 (ej: gengar)" autocomplete="off">
        <input name="p6" placeholder="Pokémon 6 (ej: mewtwo)" autocomplete="off">
        <button type="submit">Cargar Equipo</button>
    </form>

    <main id="equipo"></main>

    <div id="acciones">
        <button id="btn-pelear">Pelear</button>
    </div>

    <section id="arena"></section>

    <script src="pokemonAPI.js" defer></script>
</body>
</html>
